<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aaregou · Junioren B FVBJ 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Hell und weiss: weisse Flächen, feine Linien, je Wettbewerb eine eigene Akzentfarbe. Layout: Startmenü mit 3 Wettbewerben, darunter Wettbewerbs-, Team- und Spielseiten (Hash-Routing). */
:root{
  /* 60 % helle Flächen · 30 % Aare-Nachtblau · 10 % Aare-Türkis als Akzent */
  --bg:#f3f5f8;
  --panel:#f3f5f8;
  --ink:#0f2433;
  --muted:#5d6d7c;
  --line:#e1e6ec;
  --navy:#0d2b3e; --navy-2:#173f57; --navy-soft:#e8eef3;
  --accent:#0a8597; --accent-hi:#5fd4e4; --accent-soft:#e2f4f7;
  --acc:var(--accent); --acc-soft:var(--accent-soft);
  --win:#1f9d55; --draw:#98a2b3; --loss:#d92d20;
  --up:#16a34a; --down:#dc2626;
  --yellow:#f5c518; --red:#d92d20;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}


/* Kopf */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:21px;text-decoration:none;letter-spacing:.2px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav a{padding:7px 11px;border-radius:8px;text-decoration:none;font-weight:600;color:rgba(255,255,255,.72);font-size:14.5px;box-shadow:inset 0 -2px 0 transparent}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{color:#fff;background:rgba(255,255,255,.1);box-shadow:inset 0 -2px 0 var(--accent-hi)}
.topbar :focus-visible{outline-color:#fff}
/* Suche */
.search{position:relative;flex:0 1 250px;min-width:180px}
.search input{width:100%;font:inherit;font-size:14px;color:#fff;background:var(--navy-2);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:7px 11px 7px 32px;outline:none}
.search input::placeholder{color:rgba(255,255,255,.6)}
.search input:focus{border-color:var(--accent-hi);background:#1d4a65}
.search::before{content:"";position:absolute;left:11px;top:50%;width:10px;height:10px;margin-top:-7px;border:2px solid rgba(255,255,255,.7);border-radius:50%}
.search::after{content:"";position:absolute;left:21px;top:50%;width:6px;height:2px;margin-top:3px;background:rgba(255,255,255,.7);transform:rotate(45deg)}
.sres{position:absolute;right:0;top:calc(100% + 6px);width:min(360px,92vw);background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(13,43,62,.18);overflow:hidden;z-index:20}
.sres .grp{padding:8px 14px 4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:var(--panel)}
.sres a{display:flex;align-items:center;gap:10px;padding:8px 14px;text-decoration:none;border-top:1px solid var(--line)}
.sres a:hover,.sres a.sel{background:var(--accent-soft)}
.sres a small{display:block;color:var(--muted);font-size:12px}
.sres .none{padding:12px 14px;color:var(--muted);font-size:14px}
@media (max-width:760px){.search{flex:1 1 100%;order:3;margin-bottom:10px}.nav{margin-left:0}}

.hero{background:var(--navy);color:#fff;border-radius:16px;padding:22px 24px 20px;margin-top:16px}
.crumbs{font-size:13px;color:rgba(255,255,255,.65);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(27px,4vw,38px);line-height:1.05;margin:8px 0 6px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.sub b{color:var(--ink);font-weight:600}
.hero .sub{color:rgba(255,255,255,.72)}.hero .sub b{color:#fff}
h2{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:700;font-size:18px;margin:0}

.grid{display:grid;gap:16px;padding:14px 0 36px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:880px){.grid-2,.grid-half{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card .sec-head h2{color:var(--navy)}
.card.acc{border-top:3px solid var(--accent)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:15px 18px 10px;flex-wrap:wrap}
.more{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.more:hover{text-decoration:underline}
.note{margin:0;padding:11px 18px;font-size:13px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
.note a{color:var(--ink)}
.empty{padding:16px 18px;color:var(--muted);margin:0}
.tag{display:inline-block;font-family:var(--font-body);font-size:12px;font-weight:600;line-height:1.35;padding:0 7px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap;vertical-align:middle}
.tag.solid{background:var(--navy);border-color:var(--navy);color:#fff}

/* Startmenü */
.start-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:920px){.start-grid{grid-template-columns:minmax(0,1fr)}}
.comp{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;text-decoration:none;transition:border-color .15s, box-shadow .15s}
.comp:hover{border-color:var(--accent);box-shadow:0 6px 22px rgba(13,43,62,.1)}
.comp-top{padding:18px 18px 14px;display:grid;gap:6px;background:var(--navy);color:#fff}
.comp-top .kicker{font-size:12px;font-weight:700;color:var(--accent-hi);text-transform:uppercase;letter-spacing:.7px}
.comp-top .name{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1}
.comp-top .state{font-size:13.5px;color:rgba(255,255,255,.72)}
.comp-top .state b{color:#fff}
.comp-body{padding:12px 18px 6px;display:grid;gap:4px;flex:1}
.mini{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.mini td{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.mini tr:last-child td{border-bottom:0}
.mini td.r{width:24px;color:var(--muted);font-weight:700}
.mini td.p{text-align:right;font-weight:700;font-family:var(--font-display);font-size:17px}
.mini .t{display:flex;align-items:center;gap:8px}
.comp-foot{padding:12px 18px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--accent);font-size:14px}
.comp-foot .go{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.start-extra{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (max-width:920px){.start-extra{grid-template-columns:minmax(0,1fr)}}
.quick{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;background:#fff}
.quick:hover{border-color:var(--accent)}
.quick .ico{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px}
.quick b{display:block}
.quick small{color:var(--muted)}

/* Wappen */
.crest{flex:none;width:28px;height:28px;display:grid;place-items:center}
.crest img{width:100%;height:100%;object-fit:contain}
.crest.ph{border-radius:50%;background:#eef0f3;color:#475467;font-family:var(--font-display);font-weight:800;font-size:10.5px;letter-spacing:.2px}
.crest.sm{width:22px;height:22px}.crest.sm.ph{font-size:8.5px}
.crest.lg{width:64px;height:64px}.crest.lg.ph{font-size:20px}
.crest.md{width:40px;height:40px}.crest.md.ph{font-size:13px}

/* Unternavigation Wettbewerb */
.subnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:14px 0 0}
.subnav a{padding:7px 13px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:14px;color:var(--muted);background:#fff}
.subnav a:hover{color:var(--ink);border-color:#cfd4dc}
.subnav a.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 var(--accent-hi)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:0 18px 12px}
.toolbar.statview{border-top:1px solid var(--line);padding-top:12px}
.toolbar.statview .chip{font-size:14px;padding:6px 14px}
.toolbar .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border:1px dashed var(--accent);border-radius:12px;background:var(--accent-soft);font-size:14px}
.banner b{color:var(--accent)}

/* Tabellen */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:center;white-space:nowrap}
th{font-size:11.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);background:var(--navy-soft)}
td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--panel)}
td.team,th.team{text-align:left;width:100%}
td.team{white-space:normal;min-width:160px}
td.team .t{display:flex;align-items:center;gap:10px}
td.team a{text-decoration:none;font-weight:600;line-height:1.25}
td.rank{width:36px;font-weight:700;position:relative}
td.rank span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px}
tr.z-up td.rank span{background:var(--up);color:#fff}
tr.z-down td.rank span{background:var(--down);color:#fff}
tr.z-up td:first-child{box-shadow:inset 3px 0 0 var(--up)}
tr.z-down td:first-child{box-shadow:inset 3px 0 0 var(--down)}
tr.z-cut td{border-bottom:2px dashed #cfd4dc}
td.pts{font-weight:800;font-family:var(--font-display);font-size:18px;color:var(--navy)}
td.strp{color:var(--muted)}
td.strp span{display:inline-block;min-width:26px;padding:2px 7px;border-radius:6px;font-weight:700}
td.strp.has span{background:#fde8e6;color:#c4271b}
th.strp{color:#c4271b}
@media (max-width:640px){.hide-sm{display:none}}
.form{display:inline-flex;gap:3px}
.fm{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff}
.fm.S{background:var(--win)}.fm.U{background:var(--draw)}.fm.N{background:var(--loss)}
.legend{padding:10px 18px 13px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.pl{font-weight:600}
.pl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.bar{height:6px;border-radius:3px;background:var(--accent);opacity:.85}
.barcell{width:110px}

/* Spiele */
.matches{display:grid}
.mday{padding:7px 18px;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;gap:10px}
.matches > .mday:first-child{border-top:0}
.m{display:grid;grid-template-columns:86px minmax(0,1fr) 66px minmax(0,1fr) 26px;align-items:center;gap:10px;padding:10px 18px;text-decoration:none;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
.m:hover{background:var(--panel)}
.m .time{font-size:12.5px;color:var(--muted);line-height:1.25}
.m .time .tag{margin-top:3px;font-size:11px;padding:0 6px}
.m .h{display:flex;align-items:center;justify-content:flex-end;gap:8px;text-align:right;min-width:0}
.m .a{display:flex;align-items:center;gap:8px;min-width:0}
.m .nm{overflow-wrap:break-word;line-height:1.2;min-width:0}
.m .nm.win{font-weight:700}
.m .nm.me{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:2px}
.score{font-family:var(--font-display);font-weight:800;font-size:20px;text-align:center;background:var(--panel);border-radius:6px;padding:2px 0;font-variant-numeric:tabular-nums}
.score small{display:block;font-family:var(--font-body);font-size:10px;font-weight:600;color:var(--muted);line-height:1.1}
.score.tbd{font-size:13px;font-family:var(--font-body);font-weight:600;color:var(--muted);background:#fff;border:1px dashed var(--line)}
.m .chev{color:var(--muted);text-align:right}
@media (max-width:540px){.m{grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);padding:10px 12px}.m .time,.m .chev{display:none}.m .crest{display:none}}
.compact .m{grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);gap:8px;padding:9px 14px}
.compact .m .time,.compact .m .chev{display:none}

/* Top-Karten */
.tops{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:0 18px 18px}
@media (max-width:1100px){.tops{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:880px){.tops{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.tops{grid-template-columns:minmax(0,1fr)}}
.top{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;text-decoration:none}
a.top:hover{border-color:var(--accent)}
.top .lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.top .row{display:flex;align-items:center;gap:10px;min-width:0}
.top .who{font-weight:600;line-height:1.2;min-width:0}
.top .who small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.top .val{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;color:var(--accent)}
/* Prognose */
.pbar{display:grid;grid-template-columns:86px minmax(0,1fr) 66px minmax(0,1fr) 26px;gap:10px;align-items:center;padding:0 18px 10px;margin-top:-4px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pbar .ph{text-align:right}.pbar .pb{grid-column:3;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.pbar .pb i{display:block;height:100%;background:var(--accent)}.pbar .pb i.d{background:#c5ced8}.pbar .pb i.a{background:var(--navy)}
.pbar b{color:var(--ink);font-weight:700}
.pbar .lbl{grid-column:1;font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
@media (max-width:540px){.pbar{grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);padding:0 12px 10px}.pbar .lbl{display:none}.pbar .pb{grid-column:2}}
.matches .m.has-pbar{border-bottom:0}
.p3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.p3 div{background:#fff;padding:12px 18px;text-align:center}
.p3 b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;color:var(--navy)}
.p3 div.hi b{color:var(--accent)}
.p3 span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
td.pc{font-variant-numeric:tabular-nums;color:var(--muted)}
td.pc.hi{color:var(--ink);font-weight:700}
td.pc .pcb{display:inline-block;height:5px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:6px;opacity:.85}
/* Aufstellung */
.lineups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
@media (max-width:760px){.lineups{grid-template-columns:minmax(0,1fr)}}
.lineups > div + div{border-left:1px solid var(--line)}
@media (max-width:760px){.lineups > div + div{border-left:0;border-top:1px solid var(--line)}}
.lu-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:700}
.lu-sub{padding:6px 18px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lu-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 18px;border-bottom:1px solid var(--line);text-decoration:none}
.lu-row:last-child{border-bottom:0}
a.lu-row:hover{background:var(--panel)}
.lu-row .nr{font-family:var(--font-display);font-weight:700;color:var(--muted);text-align:right}
.lu-row .nm{line-height:1.2;font-weight:600}
.lu-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.lu-row .ev{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.lu-row .ev span{display:inline-flex;align-items:center;gap:3px}
.lu-row .ev .ic.ball{width:13px;height:13px;border-width:2px}.lu-row .ev .ic.ball::after{width:4px;height:4px}
.lu-row .ev .ic.card-y,.lu-row .ev .ic.card-r{width:9px;height:12px}
.lu-row.out{opacity:.5}
.arr-in{color:var(--win);font-weight:800}.arr-out{color:var(--loss);font-weight:800}
.role{display:inline-block;font-size:12px;color:var(--muted)}
/* Rekorde */
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1px;background:var(--line)}
.split > *{background:#fff}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}.split > * + * thead{display:none}}
.recs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 18px 18px}
@media (max-width:880px){.recs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.recs{grid-template-columns:minmax(0,1fr)}}
.rec{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;text-decoration:none;min-height:128px}
a.rec:hover{border-color:var(--accent)}
.rec .lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.rec .val{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1;color:var(--accent)}
.rec .val small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.rec .who{font-weight:600;line-height:1.25;margin-top:auto}
.rec .who small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
/* Spielerseite */
.pev{display:flex;gap:12px;flex-wrap:wrap;padding:0 18px 10px 114px;margin-top:-4px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.pev span{display:inline-flex;align-items:center;gap:5px}
.pev .ic.ball{width:13px;height:13px;border-width:2px}.pev .ic.ball::after{width:4px;height:4px}

.top .val small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}

/* Spielbericht */

.gh{padding:20px 18px 18px;display:grid;gap:14px}
.gh .meta{text-align:center;font-size:13px;color:var(--muted)}
.gh .board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:start}
.gh .side{display:grid;justify-items:center;gap:8px;text-align:center}
.gh .side a,.gh .side span.n{font-weight:700;text-decoration:none;font-size:16px;line-height:1.2}
.gh .side a:hover{text-decoration:underline}
.gh .big{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,8vw,56px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;padding-top:8px}
.gh .ht{text-align:center;color:var(--muted);font-size:13px}
.gh .sc{font-size:13px;color:var(--muted);line-height:1.5}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-top:1px solid var(--line);margin:0}
.facts div{padding:12px 18px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts dt{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600}
.facts a{color:var(--accent)}
.tl{list-style:none;margin:0;padding:6px 0}
.tl li{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);align-items:center;gap:10px;padding:7px 18px}
.tl li .min{text-align:center;font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--muted);grid-column:2;grid-row:1}
.tl li .ev{display:flex;align-items:center;gap:8px;min-width:0;grid-row:1}
.tl li .ev.H{justify-content:flex-end;text-align:right;grid-column:1}
.tl li .ev.A{grid-column:3}
.tl li.sep{grid-template-columns:1fr}
.tl li.sep span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:4px 0}
.ic{flex:none;display:inline-grid;place-items:center}
.ic.card-y{width:12px;height:16px;border-radius:2px;background:var(--yellow)}
.ic.card-r{width:12px;height:16px;border-radius:2px;background:var(--red)}
.ic.card-yr{width:14px;height:17px;position:relative}
.ic.card-yr::before,.ic.card-yr::after{content:"";position:absolute;width:11px;height:15px;border-radius:2px}

/* Team */

.view{display:none}.view.on{display:block}

<main class="wrap" id="app">
  <div class="loading" id="loading">Daten werden geladen …</div>

<script>
/* ============ Daten laden ============ */
const COMP_INFO = {
  yl: {name:"BRACK.CH Youth League B", short:"Youth League B", tag:"Youth League", color:"c-yl", zones:{down:2}},
  promo: {name:"Junioren B Promotion", short:"Promotion B", tag:"Promotion", color:"c-promo", zones:{up:2, down:3}},
  eq: {name:"EQUIP.Lab Berner Cup – Junioren B", short:"Cup", tag:"Cup", color:"c-cup"},
  bcj: {name:"Cup BCJ – Junioren B", short:"Cup BCJ", tag:"Cup BCJ", color:"c-bcj"}
};
const SHORT = {
  "FC Aarberg":"Aarberg","FC Azzurri Bienne a":"Azzurri Bienne","FC Goldstern a":"Goldstern","FC Ins Müntschemier":"Ins Müntschemier","FC Köniz a":"Köniz",
  "FC Langenthal a":"Langenthal","FC Vicques":"Vicques","SC Burgdorf 1898 a":"Burgdorf","SC Bümpliz 78 a":"Bümpliz 78","Team Ajoie Centre (FC Alle) a":"Ajoie Centre",
  "Team Grand Chasseral (Birse Football Club) a":"Grand Chasseral","Ämme Team (FC BW Oberburg) a":"Ämme Team",
  "FC Breitenrain a":"Breitenrain","Team Chiesetau (FC Oberdiessbach) a":"Chiesetau","Team Untere Emme (FC Kirchberg)":"Untere Emme","FC Grünstern":"Grünstern",
  "FC Bern 1894":"FC Bern 1894","SR Delémont a":"SR Delémont","FC Frutigen / Reichenbach a":"Frutigen/Reichenbach","FC Lerchenfeld a":"Lerchenfeld",
  "FC Münsingen":"Münsingen","FC Dürrenast a":"Dürrenast","FC Interlaken a":"Interlaken","FC Spiez":"Spiez"
};
const MC = "https://matchcenter.fvbj-afbj.ch/default.aspx?oid=6&lng=1&ln=&v=0&tg=";
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

const S = {updated:null, leagues:{}, cups:{}, games:[], teams:[], teamByName:new Map(), logos:{}, pl:{}, pos:[], lu:{}};

function teamOf(name) {
  if (S.teamByName.has(name)) return S.teamByName.get(name);
  const short = SHORT[name] || name.replace(/\s*\(.*?\)/g, "").replace(/^(FC|SC|SV|SR)\s+/, "").replace(/\s+a$/, "").trim();
  const base = name.replace(/\(.*?\)/g, " ").replace(/\b(FC|SC|SV|SR|US|CS|GJAO|GJV|Team|SCI)\b/g, " ").trim();
  const w = (base.match(/[A-Za-zÀ-ÿ]+/) || name.match(/[A-Za-zÀ-ÿ]+/) || ["?"])[0];
  const t = {id:S.teams.length, name, short, abbr:w.slice(0, 3).toUpperCase(), leagues:new Set(), strp:{}};
  S.teams.push(t); S.teamByName.set(name, t); return t;
}
function parseDate(d, t) { const [dd, mm, yy] = d.split(".").map(Number); const [h, mi] = (t || "0:0").split(":").map(Number); return new Date(yy, mm - 1, dd, h || 0, mi || 0); }
function parseEv(s) {
  if (!s) return [];
  return s.split("~").filter(Boolean).map(evOne)
    .filter(e => e.t !== "S" || e.who.includes(">")).sort((a, b) => a.sort - b.sort);
}
function evOne(e) { const [m, t, side, who] = e.split(";"); const [b, x] = (m || "").split("+").map(Number); return {m:m || "", sort:!m ? 999 : b === 45 && x ? 45 + x / 100 : b + (x || 0), t, s:side, who}; }
function minTxt(e) { return e.m ? e.m + "'" : ""; }
/* Manuelle Korrekturen (corrections.txt): REN|Spiel|Minute|alt|neu, ADD|Spiel|Minute;Typ;Seite;Name */
function parseCorr(txt) {
  const C = {ren:{}, add:{}};
  (txt || "").split("\n").forEach(l => { l = l.trim(); if (!l || l[0] === "#") return; const p = l.split("|");
    if (p[0] === "REN" && p.length >= 5) (C.ren[p[1]] = C.ren[p[1]] || []).push({m:p[2], from:p[3], to:p[4]});
    else if (p[0] === "ADD" && p.length >= 3) (C.add[p[1]] = C.add[p[1]] || []).push(evOne(p[2])); });
  return C;
}
function applyCorr(g, C) {
  (C.ren[g.tg] || []).forEach(r => g.ev.forEach(e => { if ((!r.m || e.m === r.m) && e.who && e.who.includes(r.from)) e.who = e.who.replace(r.from, r.to); }));
  const adds = C.add[g.tg]; if (!adds || g.gh === null) return;
  const isGoal = e => e.t === "G" || e.t === "P" || e.t === "OG";
  adds.forEach(a => { const need = a.s === "H" ? g.gh : g.ga; const have = g.ev.filter(e => isGoal(e) && e.s === a.s).length;
    if (have < need) { a.fix = true; g.ev.push(a); } });
  g.ev.sort((a, b) => a.sort - b.sort);
}
function roundKind(name) { return /Frühjahr|Frühling|Rückrunde/i.test(name) ? "fj" : /Herbst|Vorrunde/i.test(name) ? "hb" : "x"; }

function parse(txt, logoTxt, corrTxt) {
  const C = parseCorr(corrTxt);
  logoTxt.trim().split("\n").forEach(l => { const i = l.indexOf("="); if (i > 0) S.logos[l.slice(0, i)] = "data:image/webp;base64," + l.slice(i + 1); });
  let league = null, round = null, cup = null;
  txt.trim().split("\n").forEach(line => {
    const p = line.split("|");
    if (p[0] === "UPDATED") S.updated = new Date(p[1]);
    else if (p[0] === "LEAGUE") { league = S.leagues[p[1]] = {key:p[1], name:p[2], ln:p[3], rounds:[]}; cup = null; }
    else if (p[0] === "ROUND") { round = {name:p[1], kind:roundKind(p[1]), table:[], games:[], comp:league.key}; league.rounds.push(round); }
    else if (p[0] === "T") { const t = teamOf(p[2]); t.leagues.add(league.key); t.strp[round.name + "|" + league.key] = +p[7];
      round.table.push({rank:+p[1], t, sp:+p[3], s:+p[4], u:+p[5], n:+p[6], strp:+p[7], gf:+p[8], ga:+p[9], pts:+p[10]}); }
    else if (p[0] === "CUP") { cup = S.cups[p[1]] = {key:p[1], name:p[2], games:[]}; league = null; }
    else if (p[0] === "LOGOS") { p[1].split(";").forEach(x => { const [n, id] = x.split("="); const t = S.teamByName.get(n) || teamOf(n); t.logoId = id; }); }
    else if (p[0] === "PL") S.pl[p[1]] = {nr:p[2], name:p[3]};
    else if (p[0] === "POS") S.pos = p[1].split(";");
    else if (p[0] === "LU") { const ent = (str, st) => (str || "").split(",").filter(Boolean).map(x => { const m = x.match(/^([0-9a-z]+)(?:\.([0-9a-z]+))?(?:#(\d+))?(!)?(\*)?$/); if (!m || !S.pl[m[1]]) return null;
        return {name:S.pl[m[1]].name, nr:m[3] || S.pl[m[1]].nr, pos:m[2] !== undefined ? S.pos[parseInt(m[2], 36)] || "" : "", cap:!!m[4], out:!!m[5], start:st}; }).filter(Boolean);
      (S.lu[p[1]] = S.lu[p[1]] || {})[p[2]] = {start:ent(p[3], true), bench:ent(p[4], false)}; }
    else if (p[0] === "G") {
      const date = parseDate(p[2], p[3]);
      const g = {tg:p[1], dstr:p[2], time:p[3], date, wd:WD[date.getDay()], H:teamOf(p[4]), A:teamOf(p[5]),
        gh: p[6] === "" ? null : +p[6], ga: p[7] === "" ? null : +p[7], nr:p[8], venue:p[9], ht:p[10], pens:p[11], forfait:p[12] === "F",
        htag:p[13], atag:p[14], ev:parseEv(p[16])};
      if (cup) { g.comp = cup.key; g.round = p[15]; cup.games.push(g); }
      else { g.comp = league.key; g.round = round.name; g.rkind = round.kind; round.games.push(g); }
      g.played = g.gh !== null;
      applyCorr(g, C);
      const goals = g.ev.filter(e => e.t === "G" || e.t === "P" || e.t === "OG");
      g.complete = !g.played || g.forfait || (goals.filter(e => e.s === "H").length === g.gh && goals.filter(e => e.s === "A").length === g.ga);
      S.games.push(g);
    }
  });
  S.teams.forEach(t => { if (t.logoId && S.logos[t.logoId]) t.logo = S.logos[t.logoId]; });
  S.games.sort((a, b) => a.date - b.date);
  S.games.forEach(g => { g.lu = S.lu[g.tg] || null; });
  computeRatings();
  Object.values(S.leagues).forEach(l => {
    l.current = [...l.rounds].reverse().find(r => r.kind === "fj" && r.games.length) || [...l.rounds].reverse().find(r => r.games.length) || l.rounds[0];
    l.hasSpring = l.rounds.some(r => r.kind === "fj" && r.games.length);
  });
}

/* ============ Prognosen (Elo-Modell aus allen bisherigen Resultaten) ============ */
const LEVEL = {"YL B":1650, "Jun.B P":1500, "Jun.B 1/S":1400, "Jun.B 2/S":1300, "Jun.B 3/S":1200};
const HOME_ADV = 35;
function computeRatings() {
  S.teams.forEach(t => { t.elo = t.leagues.has("yl") ? 1650 : t.leagues.has("promo") ? 1500 : null; });
  S.games.forEach(g => [[g.H, g.htag], [g.A, g.atag]].forEach(([t, tag]) => { if (t.elo == null && LEVEL[tag]) t.elo = LEVEL[tag]; }));
  S.teams.forEach(t => { if (t.elo == null) t.elo = 1350; t.elo0 = t.elo; });
  S.games.filter(g => g.played && !g.forfait).forEach(g => {
    const E = 1 / (1 + Math.pow(10, -((g.H.elo + HOME_ADV) - g.A.elo) / 400));
    const res = g.gh > g.ga ? 1 : g.gh < g.ga ? 0 : 0.5; const gd = Math.abs(g.gh - g.ga);
    const G = Math.min(gd <= 1 ? 1 : gd === 2 ? 1.5 : (11 + gd) / 8, 2.5);
    const d = 32 * G * (res - E); g.H.elo += d; g.A.elo -= d;
  });
}
function predict(h, a) {
  const d = (h.elo + HOME_ADV) - a.elo; const E = 1 / (1 + Math.pow(10, -d / 400));
  const pD = Math.min(0.26 * Math.exp(-Math.pow(d / 260, 2)), 1.6 * Math.min(E, 1 - E));
  return {h:E - pD / 2, d:pD, a:1 - E - pD / 2, adv:E};
}
const pct = x => Math.round(x * 100) + " %";
// fester Zufalls-Startwert: gleiche Daten ergeben immer dieselben Prozentwerte
const seeded = (a = 20262027) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function probRow(g, cup) {
  const p = predict(g.H, g.A);
  if (cup) return `<div class="pbar"><span class="lbl">Weiter</span><span class="ph"><b>${pct(p.adv)}</b></span><span class="pb"><i style="width:${p.adv * 100}%"></i><i class="a" style="width:${(1 - p.adv) * 100}%"></i></span><span><b>${pct(1 - p.adv)}</b></span><span></span></div>`;
  return `<div class="pbar"><span class="lbl">Prognose</span><span class="ph">Sieg <b>${pct(p.h)}</b></span><span class="pb"><i style="width:${p.h * 100}%"></i><i class="d" style="width:${p.d * 100}%"></i><i class="a" style="width:${p.a * 100}%"></i></span><span><b>${pct(p.a)}</b> Sieg · ${pct(p.d)} remis</span><span></span></div>`;
}
const withProb = (g, opt = {}) => matchRow(g, opt).replace('class="m"', 'class="m has-pbar"') + probRow(g, isCup(g.comp));
const STAGE = {16:"Achtelfinal", 8:"Viertelfinal", 4:"Halbfinal", 2:"Final", 1:"Cupsieg"};
function cupOdds(N = 10000) {
  if (S._cupOdds !== undefined) return S._cupOdds;
  const eq = S.cups.eq; if (!eq) return null; const rnd = seeded();
  const rounds = [...new Set(eq.games.map(g => g.round))];
  const cur = rounds.find(r => eq.games.some(g => g.round === r && !g.played)); if (!cur) return null;
  const gs = eq.games.filter(g => g.round === cur);
  const teams = gs.flatMap(g => [g.H, g.A]);
  const stages = []; for (let n = gs.length; n >= 1; n = Math.floor(n / 2)) { stages.push(n); if (n === 1) break; }
  const cnt = new Map(teams.map(t => [t, stages.map(() => 0)]));
  for (let i = 0; i < N; i++) {
    let alive = gs.map(g => g.played ? winner(g) : (rnd() < predict(g.H, g.A).adv ? g.H : g.A));
    let st = 0;
    while (true) {
      alive.forEach(t => cnt.get(t)[st]++);
      if (alive.length <= 1) break;
      for (let k = alive.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [alive[k], alive[j]] = [alive[j], alive[k]]; }
      const nx = []; for (let k = 0; k + 1 < alive.length; k += 2) nx.push(rnd() < predict(alive[k], alive[k + 1]).adv ? alive[k] : alive[k + 1]);
      if (alive.length % 2) nx.push(alive[alive.length - 1]);
      alive = nx; st++;
    }
  }
  return S._cupOdds = {round:cur, stages, rows:teams.map(t => ({t, p:cnt.get(t).map(c => c / N)})).sort((a, b) => b.p[b.p.length - 1] - a.p[a.p.length - 1] || b.p[0] - a.p[0])};
}
function leagueOdds(key, r, N = 4000) {
  const open = r.games.filter(g => !g.played); if (!open.length || !r.table.length) return null; const rnd = seeded();
  const z = COMP_INFO[key].zones || {}; const n = r.table.length;
  const base = r.table.map(x => ({t:x.t, pts:x.pts, gd:x.gf - x.ga, strp:x.strp}));
  const idx = new Map(base.map((b, i) => [b.t, i]));
  const acc = base.map(() => ({rank:0, up:0, down:0, pts:0, first:0}));
  const pr = open.map(g => ({h:idx.get(g.H), a:idx.get(g.A), p:predict(g.H, g.A)})).filter(x => x.h != null && x.a != null);
  for (let i = 0; i < N; i++) {
    const cur = base.map(b => ({...b}));
    pr.forEach(({h, a, p}) => { const u = rnd(); if (u < p.h) { cur[h].pts += 3; cur[h].gd++; cur[a].gd--; } else if (u < p.h + p.d) { cur[h].pts++; cur[a].pts++; } else { cur[a].pts += 3; cur[a].gd++; cur[h].gd--; } });
    const order = cur.map((c, k) => k).sort((x, y) => cur[y].pts - cur[x].pts || cur[x].strp - cur[y].strp || cur[y].gd - cur[x].gd || x - y);
    order.forEach((k, pos) => { const A = acc[k]; A.rank += pos + 1; A.pts += cur[k].pts; if (pos === 0) A.first++; if (z.up && pos < z.up) A.up++; if (z.down && pos >= n - z.down) A.down++; });
  }
  return {open:open.length, rows:base.map((b, k) => ({t:b.t, rank:acc[k].rank / N, pts:acc[k].pts / N, first:acc[k].first / N, up:acc[k].up / N, down:acc[k].down / N})).sort((a, b) => a.rank - b.rank), z};
}
const pcCell = (v, hi) => `<td class="pc ${v >= 0.5 && hi ? "hi" : ""}">${v < 0.005 ? "–" : v > 0.995 ? "100 %" : `<span class="pcb" style="width:${Math.max(3, v * 40)}px"></span>${pct(v)}`}</td>`;

/* ============ Helfer ============ */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const crest = (t, cls = "") => t.logo ? `<span class="crest ${cls}"><img src="${t.logo}" alt=""></span>` : `<span class="crest ph ${cls}" aria-hidden="true">${esc(t.abbr)}</span>`;
const isOurs = t => t.leagues.size > 0;
const teamLink = (t, label) => isOurs(t) ? `<a href="#team-${t.id}">${esc(label || t.short)}</a>` : `<span class="n">${esc(label || t.short)}</span>`;
const fmtDate = g => `${g.wd} ${g.dstr}`;
const playerHref = (name, t) => `#spieler-${t.id}-${encodeURIComponent(name)}`;
const evTeam = (g, e) => { let t = e.s === "H" ? g.H : e.s === "A" ? g.A : null; if (t && e.t === "OG") t = t === g.H ? g.A : g.H; return t; };
const evNames = e => e.t === "S" ? e.who.split(">").map(x => x.trim()) : [String(e.who || "").trim()];
const norm = x => String(x).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const compTag = (c, solid) => `<span class="tag ${solid ? "solid" : ""}">${esc(COMP_INFO[c].tag)}</span>`;
const COMP_ORDER = ["yl", "promo", "eq", "bcj"];
const byComp = arr => [...arr].sort((a, b) => COMP_ORDER.indexOf(a) - COMP_ORDER.indexOf(b));
const isCup = c => c === "eq" || c === "bcj";
function winner(g) {
  if (!g.played) return null;
  if (g.gh !== g.ga) return g.gh > g.ga ? g.H : g.A;
  if (g.pens) { const [a, b] = g.pens.split(":").map(Number); return a > b ? g.H : g.A; }
  return null;
}
function resFor(g, t) { if (!g.played) return null; const w = winner(g); if (!w) return "U"; return w === t ? "S" : "N"; }
const fmtStamp = d => d ? `${d.getDate().toString().padStart(2, "0")}.${(d.getMonth() + 1).toString().padStart(2, "0")}.${d.getFullYear()}, ${d.getHours().toString().padStart(2, "0")}:${d.getMinutes().toString().padStart(2, "0")}` : "–";
const roundShort = r => (r || "").replace("-Final", "").replace("Runde 1", "R1").replace("Gruppe ", "Gr. ");

function matchRow(g, opt = {}) {
  const w = winner(g);
  let score;
  if (!g.played) score = `<span class="score tbd">${g.time || "offen"}</span>`;
  else score = `<span class="score">${g.gh}:${g.ga}${g.pens ? `<small>n.P. ${g.pens}</small>` : g.forfait ? "<small>Forfait</small>" : ""}</span>`;
  let left = g.time || "";
  if (opt.date) left = g.dstr.slice(0, 5);
  if (opt.comp) left = `${g.dstr.slice(0, 5)}<br>${compTag(g.comp)}`;
  const me = opt.me;
  const right = opt.res && g.played ? `<span class="fm ${resFor(g, me)}">${resFor(g, me)}</span>` : "›";
  return `<a class="m" href="#spiel-${g.tg}" aria-label="${esc(g.H.short)} gegen ${esc(g.A.short)}">
    <span class="time">${left}</span>
    <span class="h"><span class="nm ${w === g.H ? "win" : ""} ${me === g.H ? "me" : ""}">${esc(g.H.short)}</span>${crest(g.H, "sm")}</span>
    ${score}
    <span class="a">${crest(g.A, "sm")}<span class="nm ${w === g.A ? "win" : ""} ${me === g.A ? "me" : ""}">${esc(g.A.short)}</span></span>
    <span class="chev">${right}</span></a>`;
}
function gamesByDay(list, opt = {}) {
  let html = "", day = null;
  list.forEach(g => { const k = opt.month ? MONTHS[g.date.getMonth()] + " " + g.date.getFullYear() : g.dstr;
    if (k !== day) { day = k; html += `<div class="mday"><span>${opt.month ? k : fmtDate(g)}</span>${opt.roundLabel ? `<span>${esc(g.round)}</span>` : ""}</div>`; }
    html += matchRow(g, opt); });
  return html || '<p class="empty">Keine Spiele.</p>';
}

/* ============ Auswertungen ============ */
function leagueGames(comp, scope) { // scope: "hb" | "fj" | "all"
  return S.games.filter(g => (comp === "all" ? true : comp === "liga" ? !isCup(g.comp) : comp === "cup" ? isCup(g.comp) : g.comp === comp)
    && (scope === "all" || isCup(g.comp) || g.rkind === scope));
}
function formOf(t, games) { return games.filter(g => g.played && (g.H === t || g.A === t)).slice(-5).map(g => ({x:resFor(g, t), g})); }
const formPills = f => `<span class="form">${f.map(o => `<span class="fm ${o.x}" title="${esc(o.g.H.short)} ${o.g.gh}:${o.g.ga} ${esc(o.g.A.short)}">${o.x}</span>`).join("")}</span>`;

function scorers(games) {
  const map = new Map();
  games.forEach(g => g.ev.forEach(e => {
    if (e.t !== "G" && e.t !== "P") return;
    const t = e.s === "H" ? g.H : e.s === "A" ? g.A : null; if (!t) return;
    const k = e.who + "|" + t.id;
    if (!map.has(k)) map.set(k, {name:e.who, t, goals:0, pens:0, games:new Set(), comps:new Set()});
    const o = map.get(k); o.goals++; if (e.t === "P") o.pens++; o.games.add(g.tg); o.comps.add(g.comp);
  }));
  return rank([...map.values()].sort((a, b) => b.goals - a.goals || a.pens - b.pens || a.name.localeCompare(b.name, "de")), "goals");
}
function rank(arr, key) { let last = null, r = 0; arr.forEach((o, i) => { if (o[key] !== last) { r = i + 1; last = o[key]; } o.rank = r; }); return arr; }
function cardsOf(games) {
  const map = new Map();
  games.forEach(g => g.ev.forEach(e => {
    if (!["Y", "YR", "R"].includes(e.t)) return;
    const t = e.s === "H" ? g.H : e.s === "A" ? g.A : null; if (!t) return;
    const k = e.who + "|" + t.id;
    if (!map.has(k)) map.set(k, {name:e.who, t, y:0, yr:0, r:0});
    const o = map.get(k); if (e.t === "Y") o.y++; else if (e.t === "YR") o.yr++; else o.r++;
  }));
  return [...map.values()].sort((a, b) => (b.r + b.yr) - (a.r + a.yr) || b.y - a.y || a.name.localeCompare(b.name, "de"));
}
function teamStats(games, onlyOurs) {
  const m = new Map();
  games.filter(g => g.played && !g.forfait).forEach(g => [[g.H, g.gh, g.ga], [g.A, g.ga, g.gh]].forEach(([t, f, c]) => {
    if (onlyOurs && !isOurs(t)) return;
    if (!m.has(t)) m.set(t, {t, sp:0, s:0, u:0, n:0, gf:0, ga:0, cs:0, fts:0});
    const o = m.get(t); o.sp++; o.gf += f; o.ga += c; if (c === 0) o.cs++; if (f === 0) o.fts++;
    const r = resFor(g, t); o[r.toLowerCase()]++;
  }));
  return [...m.values()];
}

/* ============ Seiten ============ */
const app = () => document.getElementById("app");
function hero(title, crumbs, sub) {
  return `<section class="hero"><div class="crumbs"><a href="#start">Start</a>${crumbs.map(c => `<span>›</span>${c}`).join("")}</div>
    <h1>${title}</h1><div class="sub">${sub || `FVBJ · Junioren B · Saison 2026/27 · Stand <b>${fmtStamp(S.updated)}</b>`}</div></section>`;
}
function foot() {
  return `<footer class="foot">Daten: <a href="https://matchcenter.fvbj-afbj.ch/default.aspx?oid=6&amp;lng=1&amp;s=2027">FVBJ Matchcenter</a> (Tabellen, Spielpläne und Spielberichte). Stand ${fmtStamp(S.updated)}. Torschützen, Karten und Wechsel stammen aus den Spielberichten und sind dort nicht immer vollständig erfasst.</footer>`;
}

      <div class="comp-body"><div class="sub" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">${esc(nextR)} · ${nextG.length} Spiele</div>
      <table class="mini"><tbody>${nextG.slice(0, 4).map(g => `<tr><td><span class="t">${crest(g.H, "sm")}${esc(g.H.short)}</span></td><td style="text-align:center;color:var(--muted)">–</td><td><span class="t" style="justify-content:flex-end">${esc(g.A.short)}${crest(g.A, "sm")}</span></td></tr>`).join("")}</tbody></table></div>
      <div class="comp-foot"><span>${S.fav ? `Favorit: ${esc(S.fav.t.short)} ${pct(S.fav.p[S.fav.p.length - 1])}` : "Runden, Resultate, Torschützen"}</span><span class="go">›</span></div></a>`;
  const upcoming = S.games.filter(g => !g.played).slice(0, 6);
  const recent = [...S.games].filter(g => g.played).reverse().slice(0, 6);
  app().innerHTML = hero("Junioren B · FVBJ 2026/27", [], `Wähle einen Wettbewerb · Stand <b>${fmtStamp(S.updated)}</b>`) + `
    <div class="grid">
      <div class="start-grid">${card("yl")}${card("promo")}${cupCard}</div>
      <div class="start-extra">
        <a class="quick" href="#stats"><span class="ico">∑</span><span><b>Statistiken</b><small>Torschützen, Karten und Rekorde über alle Wettbewerbe</small></span></a>

        <section class="card"><div class="sec-head"><h2>Letzte Resultate</h2></div><div class="matches">${gamesByDay(recent, {comp:true})}</div></section>
      </div>
    </div>` + foot();
}

/* ---- Liga ---- */
const LSTATE = {round:{}};
function leagueRound(key) { const l = S.leagues[key]; const want = LSTATE.round[key]; return l.rounds.find(r => r.name === want) || l.current; }
function roundChips(key, onlyPlayed) {
  const l = S.leagues[key]; const cur = leagueRound(key);
  const hasFj = l.rounds.some(r => r.kind === "fj");
  let html = `<div class="chips" data-league="${key}">`;
  if (!hasFj) html += `<button class="chip" type="button" disabled title="Noch nicht publiziert">Frühjahrsrunde</button>`;
  [...l.rounds].sort((a, b) => (a.kind === "fj" ? -1 : 1) - (b.kind === "fj" ? -1 : 1)).forEach(r => html += `<button class="chip ${r === cur ? "on" : ""}" type="button" data-round="${esc(r.name)}">${esc(r.name)}</button>`);
  return html + "</div>";
}
function zoneCls(key, x, n) {
  const z = COMP_INFO[key].zones || {};
  const cls = x.rank <= (z.up || 0) ? "z-up" : x.rank > n - (z.down || 0) ? "z-down" : "";
  const cut = (z.up && x.rank === z.up) || (z.down && x.rank === n - z.down) ? " z-cut" : "";
  return cls + cut;
}
const strpCell = x => `<td class="strp ${x.strp ? "has" : ""}" title="Strafpunkte"><span>${x.strp}</span></td>`;
function standings(key, r) {
  const n = r.table.length;
  const rows = r.table.map(x => `<tr class="clk ${zoneCls(key, x, n)}" data-href="#team-${x.t.id}"><td class="rank"><span>${x.rank}</span></td>
      <td class="team"><span class="t">${crest(x.t)}${teamLink(x.t, x.t.name)}</span></td>
      <td>${x.sp}</td><td>${x.s}</td><td>${x.u}</td><td>${x.n}</td><td>${x.gf}:${x.ga}</td><td class="hide-sm">${x.gf - x.ga > 0 ? "+" : ""}${x.gf - x.ga}</td>
      <td class="pts">${x.pts}</td><td class="hide-sm">${formPills(formOf(x.t, r.games))}</td>${strpCell(x)}</tr>`).join("");
  return `<div class="tbl-wrap"><table><thead><tr><th>#</th><th class="team">Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Tore</th><th class="hide-sm">TD</th><th>Pkt</th><th class="hide-sm">Form</th><th class="strp">SP</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function standingsMini(key, r) {
  const n = r.table.length;
  const rows = r.table.map(x => `<tr class="clk ${zoneCls(key, x, n)}" data-href="#team-${x.t.id}"><td class="rank"><span>${x.rank}</span></td>
      <td class="team"><span class="t">${crest(x.t, "sm")}${teamLink(x.t)}</span></td><td>${x.sp}</td><td class="pts">${x.pts}</td>${strpCell(x)}</tr>`).join("");
  return `<div class="tbl-wrap"><table><thead><tr><th>#</th><th class="team">Team</th><th>Sp</th><th>Pkt</th><th class="strp">SP</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function scorerTable(list, opt = {}) {
  if (!list.length) return '<p class="empty">Keine Torschützen erfasst.</p>';
  const max = list[0].goals;
  return `<div class="tbl-wrap"><table><thead><tr><th>#</th><th class="team">Spieler</th>${opt.full ? '<th class="hide-sm barcell"></th><th>Sp</th><th>Pen.</th>' : ""}${opt.comps ? '<th class="hide-sm">Wettbewerb</th>' : ""}<th>Tore</th></tr></thead><tbody>${
    list.map(s => `<tr class="clk" data-href="${playerHref(s.name, s.t)}"><td class="rank">${s.rank}</td>
      <td class="team"><span class="t">${crest(s.t, "sm")}<span class="pl">${esc(s.name)}<small>${esc(s.t.short)}</small></span></span></td>
      ${opt.full ? `<td class="hide-sm barcell"><div class="bar" style="width:${Math.round(s.goals / max * 100)}%"></div></td><td>${s.games.size}</td><td>${s.pens || ""}</td>` : ""}
      ${opt.comps ? `<td class="hide-sm">${byComp(s.comps).map(c => compTag(c)).join(" ")}</td>` : ""}
      <td class="pts">${s.goals}</td></tr>`).join("")}</tbody></table></div>`;
}
function trendPlayers(games) {
  const byTeam = new Map();
  games.filter(g => g.played && !g.forfait).sort((a, b) => a.date - b.date).forEach(g => [g.H, g.A].forEach(t => { if (!isOurs(t)) return; if (!byTeam.has(t)) byTeam.set(t, []); byTeam.get(t).push(g); }));
  const out = [];
  byTeam.forEach((list, t) => { const last = list.slice(-3); const m = new Map();
    last.forEach((g, i) => g.ev.forEach(e => { if ((e.t !== "G" && e.t !== "P") || evTeam(g, e) !== t) return; if (!m.has(e.who)) m.set(e.who, {name:e.who, t, n:0, per:last.map(() => 0), games:last}); const o = m.get(e.who); o.n++; o.per[i]++; }));
    out.push(...m.values()); });
  return rank(out.sort((a, b) => b.n - a.n || b.per[b.per.length - 1] - a.per[a.per.length - 1] || a.name.localeCompare(b.name, "de")), "n");
}
function trendTable(list) {
  if (!list.length) return '<p class="empty">Keine Torschützen erfasst.</p>';
  const opp = (g, t) => t === g.H ? g.A : g.H;
  return `<div class="tbl-wrap"><table><thead><tr><th>#</th><th class="team">Spieler</th><th class="hide-sm">Letzte 3 Spiele</th><th>Tore</th></tr></thead><tbody>${list.map(s => `<tr class="clk" data-href="${playerHref(s.name, s.t)}"><td class="rank">${s.rank}</td>
    <td class="team"><span class="t">${crest(s.t, "sm")}<span class="pl">${esc(s.name)}<small>${esc(s.t.short)}</small></span></span></td>
    <td class="hide-sm"><span class="form">${s.per.map((x, i) => `<span class="fm ${x ? "S" : "U"}" title="gegen ${esc(opp(s.games[i], s.t).short)}, ${s.games[i].dstr}">${x}</span>`).join("")}</span></td>
    <td class="pts">${s.n}</td></tr>`).join("")}</tbody></table></div>`;
}
function topCards(games, key) {
  const sc = scorers(games); const ts = teamStats(games, true);
  if (!sc.length || !ts.length) return "";
  const byGF = [...ts].sort((a, b) => b.gf - a.gf)[0], byGA = [...ts].sort((a, b) => a.ga / a.sp - b.ga / b.sp)[0], byCS = [...ts].sort((a, b) => b.cs - a.cs)[0];
  const tr = trendPlayers(games)[0];
  const card = (lbl, href, t, who, sub, val, unit) => `<a class="top" href="${href}"><span class="lbl">${lbl}</span><span class="row">${crest(t, "md")}<span class="who">${esc(who)}<small>${esc(sub)}</small></span></span><span class="val">${val}<small>${unit}</small></span></a>`;
  return `<div class="tops">${[
    card("Torschützenkönig", playerHref(sc[0].name, sc[0].t), sc[0].t, sc[0].name, sc[0].t.short, sc[0].goals, "Tore"),
    tr ? card("Spieler im Trend", playerHref(tr.name, tr.t), tr.t, tr.name, tr.t.short, tr.n, "Tore in 3 Spielen") : "",
    card("Offensive", `#team-${byGF.t.id}`, byGF.t, byGF.t.short, "meiste Tore", byGF.gf, "Tore"),
    card("Defensive", `#team-${byGA.t.id}`, byGA.t, byGA.t.short, "wenigste Gegentore", byGA.ga, "Gegentore"),
    card("Clean Sheets", `#team-${byCS.t.id}`, byCS.t, byCS.t.short, "Spiele ohne Gegentor", byCS.cs, "Spiele")].join("")}</div>`;
}
function leagueHead(key, tab) {
  const info = COMP_INFO[key];
  const tabs = [["", "Übersicht"], ["-tabelle", "Tabelle"], ["-chancen", "Chancen"], ["-spiele", "Spiele"], ["-stats", "Statistiken"]];
  return hero(`${esc(info.name)} 2026/27`, [`<a href="#${key}">${esc(info.short)}</a>`]) +
    `<nav class="subnav">${tabs.map(([s, n]) => `<a href="#${key}${s}" class="${tab === s ? "on" : ""}">${n}</a>`).join("")}</nav>`;
}
function springBanner(key) {
  const l = S.leagues[key];
  if (l.hasSpring) return "";
  return `<div class="banner"><span>ℹ️</span><span><b>Frühjahrsrunde 2027:</b> Der FVBJ hat die Gruppeneinteilung und den Spielplan noch nicht publiziert. Sobald sie im Matchcenter stehen, erscheinen sie hier automatisch als Standard-Ansicht. Bis dahin siehst du die abgeschlossene Herbstrunde.</span></div>`;
}
function strengthTable(key) {
  const teams = [...new Set(S.leagues[key].rounds.flatMap(r => r.table.map(x => x.t)))];
  const played = t => S.games.filter(g => g.played && !g.forfait && (g.H === t || g.A === t)).length;
  const rows = teams.map(t => ({t, elo:t.elo, sp:played(t)})).sort((a, b) => b.elo - a.elo);
  const hi = rows[0].elo, lo = rows[rows.length - 1].elo, span = Math.max(hi - lo, 1);
  return `<div class="tbl-wrap"><table><thead><tr><th>#</th><th class="team">Team</th><th class="hide-sm barcell">Stärke</th><th>Wert</th><th>Sp</th></tr></thead><tbody>${rows.map((x, i) => `<tr class="clk" data-href="#team-${x.t.id}"><td class="rank"><span>${i + 1}</span></td>
    <td class="team"><span class="t">${crest(x.t)}${teamLink(x.t, x.t.name)}</span></td>
    <td class="hide-sm barcell"><div class="bar" style="width:${Math.round((x.elo - lo) / span * 100)}%"></div></td>
    <td class="pts">${Math.round(x.elo)}</td><td>${x.sp}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">Jedes Team startet mit einem Wert nach Liga-Stärke; Siege gegen starke Gegner heben ihn, Niederlagen senken ihn (ein Elo-Modell). Höher = stärker.</p>`;
}
function viewLeague(key, tab) {
  const l = S.leagues[key]; const r = leagueRound(key); const info = COMP_INFO[key];
  let body = "";
  if (tab === "") {
    const latest = [...r.games].filter(g => g.played).reverse().slice(0, 6);
    const next = r.games.filter(g => !g.played).slice(0, 6);
    body = `${springBanner(key)}
      <section class="card acc"><div class="sec-head"><h2>Top Teams &amp; Spieler · ${esc(r.name)}</h2></div>${topCards(r.games, key)}</section>
      <div class="grid-half">
        <section class="card acc"><div class="sec-head"><h2>Tabelle · ${esc(r.name)}</h2><a class="more" href="#${key}-tabelle">Ganze Tabelle</a></div>${standingsMini(key, r)}</section>

/* ---- Statistiken (wettbewerbsübergreifend oder einzeln) ---- */
const STATS = {comp:"all", scope:"all"};
function records(games) {
  const pl = games.filter(g => !g.forfait);
  const R = {};
  R.big = [...pl].sort((a, b) => Math.abs(b.gh - b.ga) - Math.abs(a.gh - a.ga) || (b.gh + b.ga) - (a.gh + a.ga))[0];
  R.most = [...pl].sort((a, b) => (b.gh + b.ga) - (a.gh + a.ga) || Math.abs(b.gh - b.ga) - Math.abs(a.gh - a.ga))[0];
  const per = [];
  pl.forEach(g => { const c = new Map(); g.ev.forEach(e => { if (e.t !== "G" && e.t !== "P") return; const t = evTeam(g, e); if (!t) return;
    const k = e.who + "|" + t.id; if (!c.has(k)) c.set(k, {name:e.who, t, g, n:0}); c.get(k).n++; }); per.push(...c.values()); });
  per.sort((a, b) => b.n - a.n || a.g.date - b.g.date);
  R.multi = per[0]; R.multiTies = per[0] ? per.filter(o => o.n === per[0].n).length - 1 : 0;
  const goals = []; pl.forEach(g => g.ev.forEach(e => { if ((e.t === "G" || e.t === "P") && e.m) goals.push({g, e, t:evTeam(g, e)}); }));
  goals.sort((a, b) => a.e.sort - b.e.sort || a.g.date - b.g.date);
  R.fast = goals[0]; R.late = [...goals].sort((a, b) => b.e.sort - a.e.sort || a.g.date - b.g.date)[0];
  R.fastTies = R.fast ? goals.filter(x => x.e.sort === R.fast.e.sort).length - 1 : 0; R.lateTies = R.late ? goals.filter(x => x.e.sort === R.late.e.sort).length - 1 : 0;
  const teams = new Map();
  games.filter(g => g.played).forEach(g => [g.H, g.A].forEach(t => { if (!teams.has(t)) teams.set(t, []); teams.get(t).push({r:resFor(g, t), ga:t === g.H ? g.ga : g.gh, f:g.forfait}); }));
  const streak = ok => { let best = null; teams.forEach((rs, t) => { let cur = 0, mx = 0; rs.forEach(r => { cur = ok(r) ? cur + 1 : 0; mx = Math.max(mx, cur); });
    if (mx && (!best || mx > best.n || (mx === best.n && isOurs(t) && !isOurs(best.t)))) best = {t, n:mx}; }); return best; };
  R.win = streak(o => o.r === "S"); R.unb = streak(o => o.r !== "N"); R.clean = streak(o => o.ga === 0 && !o.f);
  R.total = pl.reduce((a, g) => a + g.gh + g.ga, 0); R.count = pl.length;
  return R;
}
function recordTiles(R) {

  const gameWho = g => `${esc(g.H.short)} – ${esc(g.A.short)}`;
  const gameSub = g => `${fmtDate(g)} · ${esc(COMP_INFO[g.comp].short)}`;
  const t = [];
  if (R.big) t.push(tile("Höchster Sieg", `#spiel-${R.big.tg}`, `${R.big.gh}:${R.big.ga}`, "", gameWho(R.big), gameSub(R.big)));
  if (R.most) t.push(tile("Torreichstes Spiel", `#spiel-${R.most.tg}`, R.most.gh + R.most.ga, "Tore", `${esc(R.most.H.short)} ${R.most.gh}:${R.most.ga} ${esc(R.most.A.short)}`, gameSub(R.most)));
  const more = n => n ? ` · ${n} weitere gleich` : "";
  if (R.multi) t.push(tile("Meiste Tore in einem Spiel", `#spiel-${R.multi.g.tg}`, R.multi.n, "Tore", esc(R.multi.name),
    `${esc(R.multi.t.short)} gegen ${esc(opp(R.multi.g, R.multi.t).short)}${more(R.multiTies)}`));
  if (R.fast) t.push(tile("Schnellstes Tor", `#spiel-${R.fast.g.tg}`, minTxt(R.fast.e), "", esc(R.fast.e.who), `${esc(R.fast.t.short)} gegen ${esc(opp(R.fast.g, R.fast.t).short)}${more(R.fastTies)}`));
  if (R.late) t.push(tile("Spätestes Tor", `#spiel-${R.late.g.tg}`, minTxt(R.late.e), "", esc(R.late.e.who), `${esc(R.late.t.short)} gegen ${esc(opp(R.late.g, R.late.t).short)}${more(R.lateTies)}`));
  if (R.win) t.push(tile("Längste Siegesserie", isOurs(R.win.t) ? `#team-${R.win.t.id}` : "", R.win.n, "Siege", esc(R.win.t.short), "in Folge"));
  if (R.clean) t.push(tile("Ohne Gegentor in Folge", isOurs(R.clean.t) ? `#team-${R.clean.t.id}` : "", R.clean.n, "Spiele", esc(R.clean.t.short), "zu null gespielt"));
  if (R.unb) t.push(tile("Ungeschlagen in Folge", isOurs(R.unb.t) ? `#team-${R.unb.t.id}` : "", R.unb.n, "Spiele", esc(R.unb.t.short), "ohne Niederlage"));
  return `<div class="recs">${t.join("")}</div>`;
}

function evChip(e, name) {

  if (e.t === "YR") return `<span><span class="ic card-yr"></span>${m}</span>`;

}
function playerGames(t, name) {
  const out = [];
  S.games.forEach(g => { if (g.H !== t && g.A !== t) return; const side = g.H === t ? "H" : "A"; const L = g.lu && g.lu[side];
    const st = L && L.start.find(p => p.name === name), bn = L && L.bench.find(p => p.name === name);
    const evs = g.ev.filter(e => e.t !== "S" && evTeam(g, e) === t && evNames(e).includes(name));
    if (st) out.push({g, role:"start", p:st, evs});
    else if (bn && !bn.out) out.push({g, role:"sub", p:bn, evs});
    else if (evs.length && !(bn && bn.out)) out.push({g, role:"", p:null, evs});
  });
  return out;
}
function viewPlayer(tid, name) {
  const t = S.teams[tid]; if (!t) return false;
  const list = playerGames(t, name); if (!list.length) return false;
  const key = isOurs(t) ? [...t.leagues][0] : "eq"; const info = COMP_INFO[key];
  const evs = list.flatMap(x => x.evs.map(e => ({g:x.g, e})));
  const goals = evs.filter(x => x.g.played && (x.e.t === "G" || x.e.t === "P"));
  const cnt = f => evs.filter(f).length;
  const lg = goals.filter(x => !isCup(x.g.comp)).length, cup = goals.length - lg;
  const nr = (list.slice().reverse().find(x => x.p) || {}).p?.nr;
  document.title = `${name} · Aaregou`;
  const rows = list.map(x => { const role = x.role === "start" ? `<span class="role">Startelf${x.p.pos ? " · " + esc(x.p.pos) : ""}${x.p.cap ? " · Captain" : ""}</span>` : x.role === "sub" ? '<span class="role">Ersatzbank</span>' : "";
    return matchRow(x.g, {comp:true, me:t}).replace('class="m"', 'class="m has-pev"') + `<div class="pev">${role}${x.evs.sort((a, b) => a.sort - b.sort).map(e => evChip(e, name)).join("")}</div>`; }).join("");
  app().innerHTML = `<div class="${info.color}">${hero(esc(name), [isOurs(t) ? `<a href="#team-${t.id}">${esc(t.short)}</a>` : esc(t.short), "Spieler"], `${esc(t.name)}${nr ? " · Nr. " + esc(nr) : ""} · Saison 2026/27`)}
    ${isOurs(t) ? `<a class="back" href="#team-${t.id}">‹ ${esc(t.short)}</a>` : ""}
    <div class="grid">
      <section class="card acc">
        <div class="team-head">${crest(t, "lg")}<div><h2>${esc(name)}</h2><div class="sub">${isOurs(t) ? teamLink(t, t.name) : esc(t.name)}</div></div></div>
        <div class="kpis"><div><span>Einsätze</span><b>${list.length}</b></div><div><span>Startelf</span><b>${list.filter(x => x.role === "start").length}</b></div><div><span>Tore</span><b>${goals.length}</b></div><div><span>Meisterschaft</span><b>${lg}</b></div><div><span>Cup</span><b>${cup}</b></div><div><span>Penaltys</span><b>${cnt(x => x.e.t === "P")}</b></div>
          <div><span>Gelb</span><b>${cnt(x => x.e.t === "Y")}</b></div><div><span>Rot</span><b>${cnt(x => x.e.t === "YR" || x.e.t === "R")}</b></div></div>
      </section>
      <section class="card"><div class="sec-head"><h2>Einsätze</h2><span class="sub">${list.length} Spiele</span></div><div class="matches">${rows}</div></section>
    </div></div>` + foot();
  return true;
}
function buildPlayers() {
  const P = new Map();
  S.games.forEach(g => g.ev.forEach(e => { const t = evTeam(g, e); if (!t || e.t === "S") return;
    evNames(e).forEach(n => { if (!n) return; const k = t.id + "|" + n; if (!P.has(k)) P.set(k, {name:n, t, goals:0, q:norm(n)});
      if ((e.t === "G" || e.t === "P") && g.played) P.get(k).goals++; }); }));
  S.games.forEach(g => g.lu && ["H", "A"].forEach(sd => { const L = g.lu[sd]; if (!L) return; const t = sd === "H" ? g.H : g.A;
    [...L.start, ...L.bench].forEach(p => { const k = t.id + "|" + p.name; if (!P.has(k)) P.set(k, {name:p.name, t, goals:0, q:norm(p.name)}); }); }));
  S.players = [...P.values()];
}
function runSearch(q) {
  const box = document.getElementById("sres"); q = norm(q.trim());
  if (q.length < 2) { box.hidden = true; box.innerHTML = ""; return; }
  const words = q.split(/\s+/);
  const hit = x => words.every(w => x.includes(w));
  const teams = S.teams.filter(t => isOurs(t) && hit(norm(t.name + " " + t.short))).slice(0, 5);
  const pl = S.players.filter(p => hit(p.q)).sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name, "de")).slice(0, 8);
  let html = "";
  if (teams.length) html += `<div class="grp">Teams</div>` + teams.map(t => `<a href="#team-${t.id}">${crest(t, "sm")}<span>${esc(t.short)}<small>${esc(COMP_INFO[[...t.leagues][0]].short)}</small></span></a>`).join("");
  if (pl.length) html += `<div class="grp">Spieler</div>` + pl.map(p => `<a href="${playerHref(p.name, p.t)}">${crest(p.t, "sm")}<span>${esc(p.name)}<small>${esc(p.t.short)}${p.goals ? ` · ${p.goals} ${p.goals === 1 ? "Tor" : "Tore"}` : ""}</small></span></a>`).join("");
  box.innerHTML = html || `<div class="none">Nichts gefunden.</div>`; box.hidden = false;
}
function closeSearch() { const box = document.getElementById("sres"); box.hidden = true; }

/* ---- Spielbericht ---- */
function evRow(e) {
  let icon = "", main = esc(e.who), sub = "";
  if (e.t === "G") { icon = '<span class="ic ball"></span>'; sub = "Tor"; }
  else if (e.t === "P") { icon = '<span class="ic ball"></span>'; sub = "Tor (Penalty)"; }
  else if (e.t === "OG") { icon = '<span class="ic ball"></span>'; sub = "Eigentor"; }
  else if (e.t === "Y") { icon = '<span class="ic card-y"></span>'; sub = "Verwarnung"; }
  else if (e.t === "YR") { icon = '<span class="ic card-yr"></span>'; sub = "Ausschluss (2. Verwarnung)"; }
  else if (e.t === "R") { icon = '<span class="ic card-r"></span>'; sub = "Ausschluss"; }
  else if (e.t === "S") { const [o, i] = e.who.split(">"); icon = '<span class="ic sub">⇄</span>'; main = esc(i); sub = "für " + esc(o); }
  const side = e.s === "A" ? "A" : "H";
  const inner = side === "H" ? `<span class="txt">${main}<small>${sub}</small></span>${icon}` : `${icon}<span class="txt">${main}<small>${sub}</small></span>`;
  return `<li><span class="ev ${side}">${inner}</span><span class="min">${minTxt(e)}</span></li>`;
}
function lineupBlock(g) {
  if (!g.lu) return "";
  const col = (sd, t) => { const L = g.lu[sd]; if (!L) return `<div><div class="lu-head">${crest(t, "sm")}${esc(t.short)}</div><p class="empty">Keine Aufstellung erfasst.</p></div>`;
    const evOf = name => g.ev.filter(e => evTeam(g, e) === t && evNames(e).includes(name)).sort((a, b) => a.sort - b.sort).map(e => {
      const m = minTxt(e);
      if (e.t === "G" || e.t === "P") return `<span><span class="ic ball"></span>${m}${e.t === "P" ? " P" : ""}</span>`;
      if (e.t === "OG") return `<span><span class="ic ball"></span>${m} ET</span>`;
      if (e.t === "Y") return `<span><span class="ic card-y"></span>${m}</span>`;
      if (e.t === "YR") return `<span><span class="ic card-yr"></span>${m}</span>`;
      if (e.t === "R") return `<span><span class="ic card-r"></span>${m}</span>`;
      if (e.t === "S") return evNames(e)[0] === name ? `<span><span class="arr-out">↓</span>${m}</span>` : `<span><span class="arr-in">↑</span>${m}</span>`;
      return ""; }).join("");
    const row = p => `<a class="lu-row ${p.out ? "out" : ""}" href="${playerHref(p.name, t)}"><span class="nr">${esc(p.nr)}</span><span class="nm">${esc(p.name)}${p.cap ? " (C)" : ""}<small>${p.out ? "kein Einsatz" : esc(p.pos || "")}</small></span><span class="ev">${p.out ? "" : evOf(p.name)}</span></a>`;
    return `<div><div class="lu-head">${crest(t, "sm")}${isOurs(t) ? teamLink(t, t.name) : esc(t.name)}</div><div class="lu-sub">Startformation</div>${L.start.map(row).join("")}
      ${L.bench.length ? `<div class="lu-sub">Ersatzbank</div>${L.bench.map(row).join("")}` : ""}</div>`; };
  return `<section class="card"><div class="sec-head"><h2>Aufstellungen</h2></div><div class="lineups">${col("H", g.H)}${col("A", g.A)}</div></section>`;
}
function viewGame(tg) {
  const g = S.games.find(x => x.tg === tg); if (!g) return false;
  const info = COMP_INFO[g.comp]; const h = g.H, a = g.A;
  const goals = side => g.ev.filter(e => (e.t === "G" || e.t === "P" || e.t === "OG") && e.s === side).map(e => `${esc(e.who)} ${minTxt(e)}${e.t === "P" ? " (P)" : e.t === "OG" ? " (ET)" : ""}`).join("<br>");
  let tl = "", ht = false;
  g.ev.forEach(e => { if (!ht && e.sort > 45.5) { tl += `<li class="sep"><span>Pause${g.ht ? " · " + g.ht : ""}</span></li>`; ht = true; } tl += evRow(e); });
  if (g.ev.length && !ht) tl += `<li class="sep"><span>Schluss</span></li>`;
  if (g.pens) tl += `<li class="sep"><span>Penaltyschiessen ${g.pens}</span></li>`;
  const w = winner(g);
  const big = g.played ? `${g.gh}:${g.ga}` : "–:–";
  const below = !g.played ? "Noch nicht gespielt" : g.pens ? `n.P. ${g.pens} · ${esc(w.short)} weiter` : g.forfait ? "Forfait" : g.ht ? "Pause " + g.ht : "&nbsp;";
  const sameComp = S.games.filter(x => x.comp === g.comp && (isCup(g.comp) || x.round === g.round)); const idx = sameComp.indexOf(g);
  let body;
  if (g.forfait) body = '<p class="empty">Forfait, kein Spielbericht.</p>';
  else if (!g.played) { const p = predict(h, a); body = isCup(g.comp)
      ? `<div class="p3" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="${p.adv >= .5 ? "hi" : ""}"><b>${pct(p.adv)}</b><span>${esc(h.short)} weiter</span></div><div class="${p.adv < .5 ? "hi" : ""}"><b>${pct(1 - p.adv)}</b><span>${esc(a.short)} weiter</span></div></div>`
      : `<div class="p3"><div class="${p.h >= p.a && p.h >= p.d ? "hi" : ""}"><b>${pct(p.h)}</b><span>Sieg ${esc(h.short)}</span></div><div><b>${pct(p.d)}</b><span>Unentschieden</span></div><div class="${p.a > p.h && p.a >= p.d ? "hi" : ""}"><b>${pct(p.a)}</b><span>Sieg ${esc(a.short)}</span></div></div>`; }
  else body = g.ev.length ? `<ul class="tl">${tl}</ul>` : '<p class="empty">Für dieses Spiel sind im Matchcenter keine Ereignisse erfasst.</p>';
  const facts = [`<div><dt>Datum</dt><dd>${fmtDate(g)}${g.time ? ", " + g.time : ""}</dd></div>`];
  if (g.venue) facts.push(`<div><dt>Spielort</dt><dd>${esc(g.venue)}</dd></div>`);
  if (g.nr) facts.push(`<div><dt>Spielnummer</dt><dd>${esc(g.nr)}</dd></div>`);
  if (/^\d+$/.test(g.tg)) facts.push(`<div><dt>Quelle</dt><dd><a href="${MC + g.tg}">Spielbericht im Matchcenter</a></dd></div>`);
  const tagH = g.htag ? `<span class="sub">${esc(g.htag)}</span>` : "", tagA = g.atag ? `<span class="sub">${esc(g.atag)}</span>` : "";
  const backHref = isCup(g.comp) ? "#cup" : `#${g.comp}-spiele`;
  app().innerHTML = `<div class="${info.color}">${hero(`${esc(h.short)} ${big} ${esc(a.short)}`, [`<a href="#${isCup(g.comp) ? "cup" : g.comp}">${esc(info.short)}</a>`, esc(g.round)])}
    <a class="back" href="${backHref}">‹ ${esc(info.short)}</a>
    <div class="grid">
      <section class="card acc"><div class="gh">
        <div class="meta">${compTag(g.comp, true)} ${esc(info.name)} · ${esc(g.round)}</div>
        <div class="board">
          <div class="side">${crest(h, "lg")}${teamLink(h, h.name)}${tagH}<div class="sc">${goals("H")}</div></div>
          <div><div class="big">${big}</div><div class="ht">${below}</div></div>
          <div class="side">${crest(a, "lg")}${teamLink(a, a.name)}${tagA}<div class="sc">${goals("A")}</div></div>
        </div></div>
        <dl class="facts">${facts.join("")}</dl></section>
      <section class="card"><div class="sec-head"><h2>${g.played ? "Spielverlauf" : "Prognose"}</h2>${g.played ? "" : '<span class="sub">Schätzung aus allen bisherigen Resultaten</span>'}</div>${body}
        ${!g.complete && g.ev.length ? '<p class="note">Im Matchcenter sind nicht alle Tore dieses Spiels einem Torschützen zugeordnet.</p>' : ""}</section>
      ${lineupBlock(g)}
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
        ${idx > 0 ? `<a class="back" style="margin:0" href="#spiel-${sameComp[idx - 1].tg}">‹ Vorheriges Spiel</a>` : "<span></span>"}
        ${idx < sameComp.length - 1 ? `<a class="back" style="margin:0" href="#spiel-${sameComp[idx + 1].tg}">Nächstes Spiel ›</a>` : ""}
      </div>
    </div></div>` + foot();
  return true;
}

/* ============ Routing ============ */
function route() {
  if (document.getElementById("sres")) closeSearch();
  const h = (location.hash || "#start").slice(1);
  let nav = "start";
  document.title = "Aaregou · Junioren B FVBJ 2026/27";
  const m = h.match(/^(yl|promo)(-tabelle|-chancen|-spiele|-stats|-teams|-hb|-fj)?$/);
  const pm = h.match(/^spieler-(\d+)-(.+)$/);
  if (m) {
    nav = m[1];
    if (m[2] === "-hb" || m[2] === "-fj") { const r = S.leagues[m[1]].rounds.find(x => x.kind === m[2].slice(1)); if (r) LSTATE.round[m[1]] = r.name; viewLeague(m[1], ""); }
    else viewLeague(m[1], m[2] || "");
  }
  else if (h === "cup" || h === "cup-stats" || h === "cup-chancen") { nav = "cup"; viewCup(h.slice(3)); }
  else if (h === "stats") { nav = "stats"; viewStats(); }
  else if (h === "teams") { viewTeams(); }
  else if (h.startsWith("team-") && viewTeam(+h.slice(5))) { const t = S.teams[+h.slice(5)]; nav = [...t.leagues][0]; }
  else if (pm && viewPlayer(+pm[1], decodeURIComponent(pm[2]))) { const t = S.teams[+pm[1]]; nav = isOurs(t) ? [...t.leagues][0] : "cup"; }
  else if (h.startsWith("spiel-") && viewGame(h.slice(6))) { const g = S.games.find(x => x.tg === h.slice(6)); nav = isCup(g.comp) ? "cup" : g.comp; }
  else viewStart();
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === nav));
  window.scrollTo(0, 0);
}
function rerender() { const y = window.scrollY; route(); window.scrollTo(0, y); }
document.addEventListener("click", e => {
  const tr = e.target.closest("tr[data-href]"); if (tr && !e.target.closest("a")) { location.hash = tr.dataset.href; return; }
  const b = e.target.closest("button.chip"); if (!b || b.disabled) return;
  const box = b.parentElement;
  if (box.dataset.league) { LSTATE.round[box.dataset.league] = b.dataset.round; rerender(); }
  else if ("statcomp" in box.dataset) { STATS.comp = b.dataset.v; rerender(); }
  else if ("statview" in box.dataset) { STATS.view = b.dataset.v; rerender(); }
  else if ("statscope" in box.dataset) { if (box.dataset.statscope) { LSTATE.scope = LSTATE.scope || {}; LSTATE.scope[box.dataset.statscope] = b.dataset.v; } else STATS.scope = b.dataset.v; rerender(); }
  else if ("teamf" in box.dataset) { TSTATE.filter = b.dataset.v; rerender(); }
});
const qEl = document.getElementById("q");
qEl.addEventListener("input", () => runSearch(qEl.value));
qEl.addEventListener("focus", () => { if (qEl.value.trim().length >= 2) runSearch(qEl.value); });
qEl.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeSearch(); qEl.blur(); }
  if (e.key === "Enter") { const a = document.querySelector("#sres a"); if (a) { location.hash = a.getAttribute("href"); qEl.value = ""; closeSearch(); qEl.blur(); } }
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) closeSearch(); else if (e.target.closest("#sres a")) { qEl.value = ""; closeSearch(); } });
document.addEventListener("change", e => { const s = e.target.closest("select[data-teamfilter]"); if (s) { LSTATE.team = LSTATE.team || {}; LSTATE.team[s.dataset.teamfilter] = s.value; rerender(); } });

Promise.all([fetch("data.txt", {cache:"no-store"}).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }), fetch("logos.txt").then(r => r.ok ? r.text() : "").catch(() => ""), fetch("corrections.txt", {cache:"no-store"}).then(r => r.ok ? r.text() : "").catch(() => "")])
  .then(([d, l, c]) => { parse(d, l, c); buildPlayers(); window.addEventListener("hashchange", route); route(); })
  .catch(err => { document.getElementById("app").innerHTML = `<div class="loading">Die Daten konnten nicht geladen werden (${esc(err.message)}). Bitte Seite neu laden.</div>`; });
</script>
</body>
